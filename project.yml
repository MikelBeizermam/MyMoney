name: MyMoney
options:
  bundleIdPrefix: com.mikibeizerman
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: he
configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  MyMoney:
    type: application
    platform: iOS
    sources:
      - path: MyMoney
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikibeizerman.mymoney
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: MyMoney/Info.plist
      properties:
        CFBundleDisplayName: MyMoney
        CFBundleDevelopmentRegion: he
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: com.mikibeizerman.mymoney
            CFBundleURLSchemes: [mymoney]
