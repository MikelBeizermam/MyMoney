# Keeps the free Supabase projects behind MyMoney and OneWallet from pausing.
# Supabase pauses free projects that show too little database activity over a
# week; its docs say a few requests a day are typically enough. So this runs
# every four hours and calls a keepalive() function in each project three times.
# The function queries a user table but returns only the current time.
# The keys below are publishable keys: they are already public in the deployed
# sites and only allow what each table's row-level security policies allow.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MyMoney
        run: |
          for i in 1 2 3; do
            curl -fsS -o /dev/null -w "MyMoney: %{http_code}\n" \
              -X POST "https://jxyvaafkuupjtfwmydqe.supabase.co/rest/v1/rpc/keepalive" \
              -H "apikey: sb_publishable_L9noQ7UZPOE4-1nmu11AYw_aZla_W7k" -H "Content-Type: application/json" -d "{}"
            sleep 5
          done
      - name: Ping OneWallet
        if: always()
        run: |
          for i in 1 2 3; do
            curl -fsS -o /dev/null -w "OneWallet: %{http_code}\n" \
              -X POST "https://kbbyqmfjcwquabervkkt.supabase.co/rest/v1/rpc/keepalive" \
              -H "apikey: sb_publishable_Sk8KPR0XxPRxVu7nt4rD0Q_pnlbl-cn" -H "Content-Type: application/json" -d "{}"
            sleep 5
          done

  # GitHub turns off scheduled workflows in repositories with no activity for
  # 60 days. A small monthly commit keeps this schedule running.
  heartbeat:
    runs-on: ubuntu-latest
    needs: ping
    steps:
      - uses: actions/checkout@v4
      - name: Monthly heartbeat commit
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((30*24*3600)) ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive.txt
            git commit -m "Keep-alive heartbeat"
            git push
          else
            echo "Recent activity found, no heartbeat needed."
          fi
